<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>Test Click Map</title>
<link rel="stylesheet" href="css/style.css">
<style>
#test-log {
  position: fixed; top: 0; left: 0; right: 0;
  background: rgba(0,0,0,.9); color: #C9A84C;
  padding: 8px 16px; font-family: monospace; font-size: 12px;
  z-index: 99999; border-bottom: 2px solid #C9A84C;
  display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
}
#test-log span { color: #40916C; }
</style>
</head>
<body>
<div id="test-log">
  <b>DEBUG:</b>
  <span id="log-init">Init: -</span>
  <span id="log-paths">Paths: -</span>
  <span id="log-click">Last click: -</span>
  <span id="log-popup">Popup: -</span>
  <span id="log-overlay">Overlay: -</span>
</div>
<div id="app"></div>

<script src="js/regions.js"></script>
<script src="js/quizData.js"></script>
<script src="js/provinceDetailData.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/home.js"></script>

<script>
// PATCH initMapEvents sebelum map.js di-load
// Override untuk inject logging
var _origInitMapEvents;
</script>

<script src="js/map.js"></script>
<script src="js/province.js"></script>
<script src="js/games.js"></script>

<script>
// Patch setelah semua load
var _origInitMap = window.initMapEvents;
window.initMapEvents = function() {
  document.getElementById('log-init').textContent = 'Init: CALLED';
  var svg = document.getElementById('indonesia-map');
  var paths = svg ? svg.querySelectorAll('.province-path') : [];
  document.getElementById('log-paths').textContent = 'Paths: ' + paths.length;
  
  // Patch setiap path untuk log klik
  if (svg) {
    svg.querySelectorAll('.province-path').forEach(function(path) {
      var origClick = null;
      path.addEventListener('click', function(e) {
        document.getElementById('log-click').textContent = 'Click: ' + path.dataset.id + ' | isSelected: ' + mapState.isSelected;
        document.getElementById('log-overlay').textContent = 'unlock-overlay display: ' + document.getElementById('unlock-overlay').style.display;
        document.getElementById('log-popup').textContent = 'region-overlay class: ' + document.getElementById('region-popup-overlay').className;
      }, true); // capture phase - jalan SEBELUM listener asli
    });
  }
  
  _origInitMap.apply(this, arguments);
};

// Navigasi ke /map
navigate('/map');
</script>
</body>
</html>
